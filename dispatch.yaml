server: http://rabbit-audit-server:8000
runtime:
  max_workers: 10
  max_running_projects: 3
  max_project_workers: 4
  interval: 3
  healthcheck_timeout: 45
  shared_model_max_running: 3
  # When true, a finding may not be reviewed by any worker backed by the SAME
  # model as the discoverer. The active workers below are all GLM-5.3, so
  # turning this on would block review until a different review model is added.
  require_distinct_review_model: false
  prompt_group: default
tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 3
  explore:
    timeout: 300
    conclude_timeout: 90
  report_enrichment:
    timeout: 180
  review:
    timeout: 300
  tool_scan:
    enabled: true
    auto_enqueue: false
    timeout_per_tool: 180
    tools: []
    max_running: 1
container:
  image: rabbit-code-audit-worker:audit
  # Workers call the GLM Anthropic endpoint (open.bigmodel.cn) directly, so they
  # need outbound internet. rabbit-audit-worker-net is internal (no internet);
  # use the default project network instead.
  network_mode: rabbit-audit-net
  completed_action: stop
  name_prefix: rabbit-audit-dispatch-
  startup_name_prefix: rabbit-audit-startup-healthcheck-
  cap_add: []
  artifact_volume: rabbit-audit-artifacts
  artifact_host_path: null
  artifact_mount_path: /audit-data
common_env:
  ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
  ANTHROPIC_MODEL: glm-5.3
  ANTHROPIC_AUTH_TOKEN: ${GLM_API_KEY}
workers:
- name: glm-audit-1
  type: claudecode
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: glm-audit-2
  type: claudecode
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: glm-audit-3
  type: claudecode
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: glm-report-1
  type: claudecode
  enabled: true
  task_types:
  - report_enrichment
  max_running: 1
  priority: 0
# Reviewer shares the same GLM-5.3 model (independent by worker name only).
# For stronger review, point this at a different model and set
# runtime.require_distinct_review_model: true.
- name: glm-review-1
  type: claudecode
  enabled: true
  task_types:
  - review
  max_running: 1
  priority: 0
