server: http://rabbit-audit-server:8000
runtime:
  max_workers: 5
  max_running_projects: 3
  max_project_workers: 4
  interval: 3
  healthcheck_timeout: 45
  # All five Pi roles use the same LuminAI endpoint/model.  Keep their combined
  # in-flight calls within the three requests that the endpoint handles reliably.
  shared_model_max_running: 3
  prompt_group: default
tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 3
  explore:
    timeout: 300
    conclude_timeout: 90
  report_enrichment:
    timeout: 180
  review:
    timeout: 300
  tool_scan:
    enabled: true
    auto_enqueue: false
    timeout_per_tool: 180
    tools: []
    max_running: 1
container:
  image: rabbit-code-audit-worker:audit
  network_mode: rabbit-audit-worker-net
  completed_action: stop
  name_prefix: rabbit-audit-dispatch-
  startup_name_prefix: rabbit-audit-startup-healthcheck-
  cap_add: []
  artifact_volume: rabbit-audit-artifacts
  artifact_host_path: null
  artifact_mount_path: /audit-data
common_env:
  PI_MODEL: gpt-5.6-sol
  PI_BASE_URL: https://vip.luminai.cc/v1
  PI_API_KEY: ${LUMINAI_API_KEY}
  PI_PROVIDER_API: openai-completions
workers:
- name: gpt-5-6-sol-audit-1
  type: pi
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: gpt-5-6-sol-audit-2
  type: pi
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: gpt-5-6-sol-audit-3
  type: pi
  enabled: true
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 1
  priority: 0
- name: gpt-5-6-sol-report-1
  type: pi
  enabled: true
  task_types:
  - report_enrichment
  max_running: 1
  priority: 0
- name: gpt-5-6-sol-retest-1
  type: pi
  enabled: true
  task_types:
  - review
  max_running: 1
  priority: 0
